changelog = """
Everything you can set, now actually settable, and a burst that follows the blow.

- **A page in Options > Mods**: one button for each of 12 settings and a reset button — droplets, mist and clouds a
  hit, whether damage sizes the burst, the multiplier on the killing blow, the width of the spray, the height of the
  arc, each mob's own colour, droplets as block crumbs or mist alone, how far it draws, and the ceilings of a tick.
  Clicking one shows its new value at once, because the game re-asks for the labels after every click.
- **`/bloodparticles` and `/bp` set the same 12** (`/bp droplets 12`, `/bp spread splash`, `/bp help`, `/bp reset`),
  values snap to what the page can show, and both names complete in the chat box.
- **Settings are saved** to the mod's own file, on every click, so they survive a restart — and the page and the
  command always agree, because they write the same line.
- **The killing blow throws three times as much** (x1 to x5, x3 by default), wider and slower; a dying body is not
  left bleeding every tick after.
- **How much blood depends on how hard the hit was**: scaled by the damage the client sees, from a third of your
  count to two and a half times, clamped so a punch still spits and a mace still looks like a spray. Off, soft and
  full are your choice.
- **2 low clouds** of mist with every burst, and the ceilings are now yours too (2 to 16 wounds, 32 to 256
  particles), with hard caps of 64/48/12 behind them.

Pinned to Nightly 2ebf00a (hook API 411), as before: the two page hooks it uses are new enough to need it.
"""

