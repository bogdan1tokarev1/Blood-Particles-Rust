# The registry entry for Blood Particles — a template.
#
# The form at playhorizon.dev/mods/submit creates this file (as
# mods/blood_particles.toml in horizon-rust/horizon-mods) and opens the pull
# request. Everything below is filled in except what depends on your GitHub:
#   - source:    this repository's public URL;
#   - owners:    your GitHub login (the form sets it when you sign in);
#   - owner_ids: your numeric GitHub id (the form fills it in; by hand it is at
#                https://api.github.com/users/<login>).
#
# api / side / capabilities / hooks / broken_on are not written by hand: CI
# reads them from the .hnmod (ours says "hooks": 411, the hook API of the commit
# it pins).

id = "blood_particles"
kind = "native-mod"
name = "Blood Particles"
summary = "Realistic blood from every hit: droplets that arc and spatter, a mist that dries darker, three times as much on the killing blow. Every part of it is yours to set."
description = """
A hurt mob bleeds. Every hit it takes — your sword, an arrow, another mob, a fall, fire, a creeper's blast —
throws **8 droplets** that fly out of the wound, arc under gravity and spatter on the ground, **6 puffs of mist**
that drift and dry darker, and **2 low clouds** where the spray went.

**How hard the blow was decides how much blood there is:** a three-heart hit throws exactly what you set, a lighter
one less, a heavier one more. **The killing blow throws three times as much**, wider and slower, and a dying body is
not left bleeding every tick after.

The spray leaves the **far side of the blow**: a zombie hit from the front bleeds backwards, and the wound sits in
its upper body, not at its feet.

**Each mob has its own blood:**

| Mob | Blood |
| --- | --- |
| everything else | red |
| slime | green |
| blaze, magma cube, strider | fire |
| enderman, endermite, shulker, ender dragon | violet ichor |
| skeletons and their kin | pale bone chips |

**Everything is configurable, twice over.** **Options > Mods** has a page with one button for each of its 12
settings and a button that puts them all back — how many droplets, how much mist, how many clouds, whether damage
sizes the burst, the multiplier on the killing blow, how wide the spray and how high the arc, each mob's own colour,
droplets as block crumbs or mist alone, how far it draws, and the two ceilings of a tick. **`/bloodparticles`** (or
**`/bp`**) sets the same 12 from chat — `/bp droplets 12`, `/bp spread splash`, `/bp reset` — and what either one
changes is saved to the mod's own file, so it is still there next time you start.

- **No textures, no models, no resource pack.** The droplets are the game's own block-crumb particle (gravity, drag
  and terrain collision included), so they spatter and leave a stain where they land; the mist is its tinted dust.
- **Client side.** It draws on your machine from what the client is already told, so it works in single player, on a
  LAN world and **on any server**, sending nothing over the network.
- **Bounded.** A burst stops at 64 droplets, 48 puffs of mist and 12 clouds; a tick stops at your own two ceilings
  (8 wounds and 112 particles by default); one hit is drawn once; the game's *Particles* setting still applies (on
  *Minimal* the game draws none of it).
- **Off means off.** The switch in **Options > Mods** stops it on the next tick, in the same world, without a
  restart.

It does not bleed the player, and it changes no damage, health, drops or hitboxes: it only draws.

By Bogdan_Tokarev. MIT.
"""
authors = ["Bogdan_Tokarev"]
owners = ["<your-github-login>"]
owner_ids = [0] # <- your account's numeric GitHub id (the form fills it in)
license = "MIT"
source = "https://github.com/<your-login>/blood-particles"
icon = "icons/blood_particles.png"
categories = ["decoration", "adventure"]
tags = ["particles", "blood", "combat", "visual", "effects", "config", "client"]

